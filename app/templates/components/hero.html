<section class="hero">
    <div class="hero-watermark" aria-hidden="true">気</div>
    <div class="container hero-container">
        <div class="hero-grid">
            <div class="hero-copy">
                <span class="badge-beta">Now in beta</span>
                <h1 class="hero-wordmark">Ki</h1>
                <p class="hero-lead">A private browser for iPhone.</p>
                <p class="hero-sub">Trackers blocked by default. Per-site control over cookies and scripts. No accounts, no telemetry, no ads.</p>

                <div class="hero-pills">
                    <span class="hero-pill">Trackers blocked</span>
                    <span class="hero-pill">Per-site control</span>
                    <span class="hero-pill">On-device</span>
                </div>

                <div class="hero-actions">
                    <a href="#" target="_blank" title="Coming soon to TestFlight" class="app-store-link">
                        <img
                            src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
                            alt="Download on the App Store — Coming soon"
                            class="app-store-badge"
                        >
                    </a>
                </div>
            </div>

            <div class="hero-visual">
                <div class="ki-phone" role="img" aria-label="The Ki browser blocking trackers on a webpage, with per-site controls for cookies and scripts">
                    <div class="ki-phone__notch" aria-hidden="true"></div>
                    <div class="ki-phone__screen">
                        <div class="ki-bar">
                            <span class="ki-bar__lock" aria-hidden="true">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
                            </span>
                            <span class="ki-bar__url">example.com</span>
                            <span class="ki-bar__shield" aria-hidden="true">気</span>
                        </div>
                        <div class="ki-page">
                            <div class="ki-shield">
                                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.4 9-8 11-4.6-2-8-6-8-11V5z"></path><path d="M9 12l2 2 4-4"></path></svg>
                                <div class="ki-shield__count">12</div>
                                <div class="ki-shield__label">trackers blocked</div>
                            </div>
                            <div class="ki-skel ki-skel--title"></div>
                            <div class="ki-skel"></div>
                            <div class="ki-skel ki-skel--short"></div>
                        </div>
                        <div class="ki-sheet">
                            <div class="ki-sheet__handle" aria-hidden="true"></div>
                            <div class="ki-toggle"><span>Block trackers</span><span class="ki-sw ki-sw--on" aria-hidden="true"></span></div>
                            <div class="ki-toggle"><span>Cross-site cookies</span><span class="ki-sw" aria-hidden="true"></span></div>
                            <div class="ki-toggle"><span>JavaScript</span><span class="ki-sw ki-sw--on" aria-hidden="true"></span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
